name: Torp-gater

on:
  schedule:
    - cron: "*/10 4-22 * * *"   # hvert 10. minutt 06–00 norsk sommertid
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/torp.py, .github/workflows/torp.yml]

permissions:
  contents: write

concurrency:
  group: torp
  cancel-in-progress: true

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent avgangstavla fra torp.no
        run: python scripts/torp.py
      - name: Publiser torp.json på grenen torp-data
        run: |
          mkdir /tmp/ut && mv torp.json /tmp/ut/
          cd /tmp/ut
          git init -q -b torp-data
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add torp.json
          git commit -q -m "Torp-gater $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" torp-data
